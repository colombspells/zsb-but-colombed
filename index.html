<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zsb but colombed</title>
    <script src="https://tailwindcss.com"></script>
    <script src="https://unpkg.com" crossorigin></script>
    <script src="https://unpkg.com" crossorigin></script>
    <script src="https://unpkg.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'JetBrains+Mono', monospace; background-color: #090d16; color: #f8fafc; }
        .word-glow { text-shadow: 0 0 10px rgba(99, 102, 241, 0.4); }
    </style>
</head>
<body>
    <div id="root"></div>
    <!-- This pulls your words from the second file -->
    <script src="words.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const GameCore = () => {
            const [shuffledWords, setShuffledWords] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [userInput, setUserInput] = useState('');
            const [startTime, setStartTime] = useState(null);
            const [wpm, setWpm] = useState(0);
            const [totalChars, setTotalChars] = useState(0);
            const [isFinished, setIsFinished] = useState(false);
            const [flashError, setFlashError] = useState(false);
            const [streakCount, setStreakCount] = useState(0);

            // --- THE TOGGLE SWITCH ---
            const [hackEnabled, setHackEnabled] = useState(true);
            const [showStatus, setShowStatus] = useState(true);

            useEffect(() => {
                // Fetch from words.js file, fallback if missing
                const wordPool = (window.ZSB_WORDS && window.ZSB_WORDS.length > 0) ? window.ZSB_WORDS : ["keyboard", "speedrun", "gaming", "hack", "matrix"];
                const randomized = [...wordPool].sort(() => Math.random() - 0.5).map(w => ({
                    text: w,
                    accepted: [w.toLowerCase(), w]
                }));
                setShuffledWords(randomized);
            }, []);

            // Press Escape to turn cheat mode on/off
            useEffect(() => {
                const handleGlobalKeyDown = (e) => {
                    if (e.key === 'Escape') {
                        setHackEnabled(prev => !prev);
                        setShowStatus(true);
                        setTimeout(() => setShowStatus(false), 2000);
                    }
                };
                window.addEventListener('keydown', handleGlobalKeyDown);
                return () => window.removeEventListener('keydown', handleGlobalKeyDown);
            }, []);

            const currentWordObj = shuffledWords[currentIndex];
            const currentWord = currentWordObj ? currentWordObj.text : "";

            const handleInputChange = (e) => {
                if (isFinished) return;
                const val = e.target.value;
                const typedLength = val ? val.length : 0;
                const targetWord = currentWordObj ? currentWordObj.accepted[0] : currentWord;

                if (hackEnabled && targetWord && typedLength > 0) {
                    const hackedVal = targetWord.substring(0, typedLength);
                    setUserInput(hackedVal);
                    setTotalChars(prev => prev + 1);
                    setFlashError(false);
                } else {
                    setUserInput(val);
                    setFlashError(!targetWord.startsWith(val));
                }

                if (!startTime && typedLength > 0) setStartTime(Date.now());
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const targetWord = currentWordObj ? currentWordObj.accepted[0] : currentWord;
                    
                    if (userInput === targetWord) {
                        const nextIndex = currentIndex + 1;
                        setStreakCount(prev => prev + 1);
                        
                        if (startTime) {
                            const mins = (Date.now() - startTime) / 60000;
                            setWpm(Math.round((totalChars / 5) / (mins || 0.001)));
                        }

                        if (nextIndex < shuffledWords.length) {
                            setCurrentIndex(nextIndex);
                            setUserInput('');
                        } else {
                            setIsFinished(true);
                        }
                    } else {
                        setFlashError(true);
                        setStreakCount(0);
                    }
                }
            };

            if (shuffledWords.length === 0) return <div className="flex h-screen items-center justify-center text-indigo-400">Loading...</div>;

            return (
                <div className="relative flex min-h-screen flex-col items-center justify-center p-6 select-none overflow-hidden bg-[#060913]">
                    {showStatus && (
                        <div className={`absolute top-8 px-6 py-3 rounded-xl border text-sm font-bold transition-all duration-300 transform animate-bounce shadow-2xl ${
                            hackEnabled ? 'bg-emerald-950/80 text-emerald-400 border-emerald-500/50' : 'bg-rose-950/80 text-rose-400 border-rose-500/50'
                        }`}>
                            ⌨️ Hack Mode: {hackEnabled ? "ENABLED" : "DISABLED"} (Tap ESC)
                        </div>
                    )}

                    <div className="grid grid-cols-3 gap-6 mb-12 w-full max-w-2xl text-center bg-slate-900/50 p-6 rounded-2xl border border-slate-800/80 backdrop-blur-md">
                        <div>
                            <div className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-1">Speed</div>
                            <div className="text-4xl font-extrabold text-indigo-400">{wpm} <span className="text-sm font-normal text-slate-400">WPM</span></div>
                        </div>
                        <div>
                            <div className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-1">Streak</div>
                            <div className="text-4xl font-extrabold text-amber-400">🔥 {streakCount}</div>
                        </div>
                        <div>
                            <div className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-1">Status</div>
                            <div className={`text-xl font-extrabold mt-2 ${hackEnabled ? 'text-emerald-400' : 'text-slate-400'}`}>{hackEnabled ? "HACKING" : "NORMAL"}</div>
                        </div>
                    </div>

                    {!isFinished ? (
                        <div className="w-full max-w-2xl text-center flex flex-col items-center">
                            <div className={`text-5xl font-bold mb-8 tracking-tight transition-all duration-200 word-glow ${flashError ? 'text-rose-500' : 'text-slate-100'}`}>
                                {currentWord}
                            </div>
                            <input
                                type="text"
                                value={userInput}
                                onChange={handleInputChange}
                                onKeyDown={handleKeyDown}
                                placeholder="Smash keys to type perfectly..."
                                className="w-full max-w-md bg-slate-950/80 text-center text-xl py-4 px-6 rounded-xl border border-slate-800 focus:outline-none focus:border-indigo-500 shadow-inner"
                                autoFocus
                            />
                            <div className="text-xs text-slate-500 mt-4">
                                Press <span className="px-1.5 py-0.5 bg-slate-800 rounded text-slate-300 font-bold mx-1">ESC</span> to toggle cheat | <span className="px-1.5 py-0.5 bg-slate-800 rounded text-slate-300 font-bold mx-1">ENTER</span> to submit
                            </div>
                        </div>
                    ) : (
                        <div className="text-center p-8 bg-slate-900/60 border border-slate-800 rounded-3xl backdrop-blur-md max-w-md w-full shadow-2xl">
                            <div className="text-5xl mb-4">🏆</div>
                            <h2 className="text-2xl font-bold text-slate-100 mb-2">Done!</h2>
                            <div className="bg-slate-950/50 p-4 rounded-xl mb-6">
                                <div className="text-4xl font-black text-indigo-400">{wpm} WPM</div>
                            </div>
                            <button onClick={() => window.location.reload()} className="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl">Play Again</button>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GameCore />);
    </script>
</body>
</html>
window.ZSB_WORDS = ["apple", "banana", "cherry", "orange", "grape", "strawberry", "blueberry", "peach", "watermelon", "pineapple", "mango", "lemon", "lime", "coconut"];
